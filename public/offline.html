<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pas de connexion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f8fafc;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            text-align: center;
            max-width: 420px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
            color: #1a3a6b;
        }
        p {
            color: #6c757d;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            background-color: #3490dc;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover { background-color: #2779bd; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#9992;</div>
        <h1>Pas de connexion internet</h1>
        <p>Impossible de charger cette page. Vérifiez votre connexion réseau et réessayez.</p>
        <button class="btn" onclick="window.location.reload();">Réessayer</button>
    </div>
</body>
</html>
